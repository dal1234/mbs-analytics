# ---------------------------------------------------------------------------
# MBS income risk (lite) - model configuration, OFFICIAL set-up. Monte Carlo / earnings at risk only.
# config/model_vendor.yaml is the same with the comparison folders (rates_output_vendor, outputs_vendor, ...).
# Paths are relative to this file. Rates are in percent unless a key ends in _bp.
# ---------------------------------------------------------------------------

portfolio:
  file: ../data/portfolio/sample_portfolio.csv   # one row per CUSIP on one as-of date (see README, "Portfolio file")
  name: Sample agency MBS portfolio              # shown in the dashboard header and stored in the run history
  # Banner across the top of every dashboard page; set to "" to remove it.
  banner: >-
    Sample data. The sample portfolio is a modelled stand-in built from public Fannie Mae pool disclosures,
    not actual holdings. Replace it with your own file (see README) before using the results.

rates:
  dir: ../rates_output          # output folder of run_rates.py (run_record.json, baseline.csv, mc_paths.csv ...)
  require_matching_as_of: true  # stop if the portfolio date and the rate as-of month differ

horizon_months: 60              # whole years, up to the rate horizon; the dashboard offers each year from 1 to this

income:
  # Income = interest on the held security + income on reinvested prepaid principal.
  reinvest_rate_series: SOFR_1M # the designated reinvestment rate: any column of the rate files
                                # (SOFR_1M, TSY_1M ... TSY_30Y, MTG_30Y)
  reinvest_spread_bp: 0         # added to the designated rate
  reinvest_scheduled_principal: false   # false = only prepaid UPB is reinvested; scheduled principal leaves the book

prepay:
  params_file: prepay_params.yaml
  multiplier: 1.0               # scales every projected speed (stress lever: 0.75, 1.25 ...)
  estimate_burnout: true        # if burnout_years is not in the portfolio, estimate it from the mortgage-rate history

risk:
  outcomes: [5, 10, 25, 50, 75, 90, 95]   # percentiles shown as representative monthly cash flows
  band_pct: 5                   # each outcome averages the paths ranked within this share of all paths around it
  tail_pct: 5                   # tail used for expected shortfall and the cohort tail attribution
  cohort_by: [product, coupon, vintage]   # how the tail attribution groups CUSIPs (any portfolio columns)
  histogram_bins: 30
  # Business-decision sensitivities on the Models & assumptions page: EaR 95% re-estimated with each switchable
  # income decision flipped, on this many of the same paths (common random numbers). 0 = skip.
  decision_paths: 500

scenarios:
  # Rate-specific (deterministic) scenarios on the dashboard's "Rate specific" tab and in outputs/scenario_*.csv.
  # Built by ratemodel/scenarios.py from the same baseline, calibration and floor as the Monte Carlo (whitepaper 13.4):
  # parallel = every Treasury tenor and 1M SOFR move the shock, the mortgage rate beta x the shock;
  # shape = the two model factors move (short_bp on 1M SOFR, long_bp on the 10-year), other tenors follow their
  # calibrated loadings, the mortgage rate beta x long_bp. Reporting views: changing them is not a model change.
  parallel_bp: [100, 200, 300, 400]   # each up and down, immediate and ramped
  ramp_months: 12                     # ramped parallel shocks reach full size here, then hold (0 = immediate only)
  include_flat: true                  # reference row: today's rates held
  shapes:
    - {id: BULL_STEEP, name: Bull steepener, short_bp: -200, long_bp: -50}
    - {id: BULL_FLAT, name: Bull flattener, short_bp: -50, long_bp: -200}
    - {id: BEAR_STEEP, name: Bear steepener, short_bp: 50, long_bp: 200}
    - {id: BEAR_FLAT, name: Bear flattener, short_bp: 200, long_bp: 50}
    - {id: TWIST_STEEP, name: Twist steepener, short_bp: -100, long_bp: 100}
    - {id: TWIST_FLAT, name: Twist flattener, short_bp: 100, long_bp: -100}
  overlays:                           # each combination re-runs every scenario; the dashboard grid switches to it
    spread_bp: [-50, -25, 0, 25, 50]  # 30Y mortgage rate only (Treasuries, SOFR unchanged), phased in over:
    spread_ramp_months: 3
    prepay_mult: [0.75, 1.0, 1.25]    # on top of prepay.multiplier

funding:
  # Liabilities: interest expense on a debt book along the same rate scenarios and Monte Carlo paths
  # (mbs_lite/funding.py; dashboard "Liabilities" view). SEPARATE from asset income for now: not netted into income/EaR.
  enabled: true
  file: ../data/liabilities/sample_debt.csv     # one row per instrument or bucket, face in $ millions (README 5b)
  name: Sample agency debt book
  source: >-
    Built from Fannie Mae's Form 10-Q for Q3 2026 (Note 8 and Liquidity and Capital Management): balances, average
    rates, maturity ranges and callable debt by group as of 2026-09-30, split into representative buckets. Carrying
    amounts; UPB is about $3bn higher (net discount). Debt of consolidated trusts (MBS) is excluded.
  balance: constant          # constant = new issues keep total debt at today's balance | runoff = no new issues
  index: SOFR_1M             # floating-rate index and the base of discount-note yields
  target_mix: current        # new issues restore the starting mix by type; or {discount_note: 0.2, floating: 0.3, ...}
  new_issues:                # term and spread of new debt (spreads calibrated to Q3 2026 issuance: discount notes
                             # 3.69% vs 1M SOFR about 3.67%; long-term about Treasuries + 10-20 bp)
    discount_note: {term_months: 3, spread_bp: 0}                 # over 1M SOFR
    floating: {term_months: 24, spread_bp: 10}                     # over 1M SOFR, reset monthly
    fixed: {term_months: 36, spread_bp: 15}                        # over the Treasury curve at the term
    callable: {term_months: 48, lockout_months: 12, spread_bp: 35}  # over the Treasury curve; callable after lockout
  call_rule:
    threshold_bp: 25         # call when the coupon exceeds the cost of replacing the remaining term by this much
    refi_spread_bp: 35       # replacement cost = Treasury curve at the remaining term + this spread (the callable
                             # new-issue spread: called debt is replaced with callable debt, which pays the option again)
  reported:                  # reconciliation shown on the dashboard (10-Q Q3 2026, Analysis of Net Interest Income)
    period: nine months to 2026-09-30
    interest_expense_musd: 5208
    average_debt_musd: 162159
    cost_pct: 4.28
    note: includes amortization of debt discounts and hedge accounting; the model counts contractual coupons only

whole_loans:
  # Single-family whole loans, RUNOFF ONLY and ILLUSTRATIVE (mbs_lite/wholeloans.py; dashboard "Whole loans" view).
  # Cohort-level, constant monthly delinquency transitions, house prices and unemployment on a fixed baseline.
  # Separate from the MBS income and EaR. Cash coupon only; principal and recoveries earn the reinvestment rate (SOFR).
  enabled: true
  file: ../data/whole_loans/sample_loans.csv
  name: Sample single-family whole loans (illustrative)
  source: >-
    Illustrative cohorts sized like Fannie Mae's loss-mitigation loans ($54.5bn) plus legacy loans in its retained
    mortgage portfolio (Form 10-Q Q3 2026). Balances, rates, LTVs and transition rates are illustrative, not data.
  behavior:                  # monthly transition rates (shares of the balance in the state) and a prepayment multiplier
    performing:   {roll_cd: 0.008, cure_dc: 0.50, roll_ds: 0.07, cure_sc: 0.135, liq_s: 0.025, prepay_mult: 1.0}
    reperforming: {roll_cd: 0.025, cure_dc: 0.35, roll_ds: 0.15, cure_sc: 0.10,  liq_s: 0.025, prepay_mult: 0.6}
    modified:     {roll_cd: 0.020, cure_dc: 0.35, roll_ds: 0.15, cure_sc: 0.10,  liq_s: 0.025, prepay_mult: 0.4}
    delinquent_buyout: {roll_cd: 0.030, cure_dc: 0.30, roll_ds: 0.20, cure_sc: 0.135, liq_s: 0.025, prepay_mult: 0.5}
    # roll_cd current -> 30-89 · cure_dc 30-89 -> current · roll_ds 30-89 -> 90+ · cure_sc 90+ -> current (cures and
    # modifications) · liq_s 90+ -> liquidation. Performing and the 90+ exits are set from Fannie's 2026 single-family
    # flows (10-Q Q3 2026: 90+ loans about 100k; 9 months of cures 64k, modifications 56k, liquidations 23k; 30-89 about
    # 1.4% and 90+ 0.62% of loans); the reperforming, modified and buyout rates are illustrative multiples.
  severity:
    liquidation_cost: 0.25   # costs, carry and forgone interest as a share of the property value
    min_severity: 0.05       # severity = max(min_severity, 1 - (1 - liquidation_cost) / LTV(t))
  macro:                     # baseline paths, one value per year (or one number): held for every rate path
    hpi_growth_pct: [3.0, 3.0, 3.0, 3.0, 3.0]
    unemployment_pct: [4.3, 4.3, 4.3, 4.3, 4.3]
    unemployment_elasticity: 1.0   # roll rates x (unemployment / unemployment at the start) ^ elasticity
  reported:
    period: Q3 2026
    interest_income_musd: 697
    average_balance_musd: 70623
    yield_pct: 3.95
    note: all mortgage loans of Fannie Mae (incl. multifamily and lender-liquidity loans), GAAP incl. discount accretion

outputs:
  dir: ../outputs
  # CUSIP-level monthly detail (balance, scheduled paydown, prepaid UPB, interest, reinvestment) is always written for
  # the average over all paths ("mean"), plus these outcomes (percentiles of income over cusip_detail_rank_years).
  cusip_detail_outcomes: [50, 5]
  cusip_detail_rank_years: 1

validation:
  # V5 (convergence) and V8 (calibration sensitivity) are run when the calibration changes and stored here, keyed by
  # calibration id; later runs reuse them. `run_model.py run --revalidate` reruns them.
  file: ../calibration/income_validation.json

history:
  file: ../history/ear_history.csv   # every run appends its EaR summary here (one row per horizon)
  months_shown: 12                   # as-of dates shown in the dashboard's "over time" chart

dashboard:
  dir: ../dashboard
  title: MBS Income Risk
  label: Official               # shown in the header; the comparison set-up's dashboard is linked from it
  compare: {label: Vendor emulation, dir: ../dashboard_vendor}
